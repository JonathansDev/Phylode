name: Upgrade test

# Installs the previous release the way its release notes say, then runs the update steps from
# the README exactly as written, on a throwaway macOS runner. If the README's steps stop
# working for someone on a release, this fails before anyone else finds out.

on:
  push:
    branches: [main]
    paths: ["src/**", "deploy/**", "Cargo.toml", "Cargo.lock", "README.md", ".github/homebrew/**", ".github/scripts/**", ".github/workflows/upgrade.yml"]
  # Every pull request: main requires this check, and one skipped by a path filter never reports.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # The user's folder is a clone whose main is the code under test, so the README's
      # `git pull` brings exactly this change. The previous release is the newest tag before it.
      - name: Make a user's folder on the previous release
        run: |
          git switch -q -C main
          prev=$(git describe --tags --abbrev=0 HEAD~1)
          next=$(sed -nE 's/^version = "(.+)"$/\1/p' Cargo.toml | head -1)
          echo "upgrading from $prev to $next"
          git clone -q "$GITHUB_WORKSPACE" "$RUNNER_TEMP/user"
          git -C "$RUNNER_TEMP/user" checkout -q "$prev"
          echo "PREV=$prev" >> "$GITHUB_ENV"
          echo "NEXT=$next" >> "$GITHUB_ENV"

      - name: Install the previous release as its notes say
        working-directory: ${{ runner.temp }}/user
        run: |
          cargo build --release
          sudo ./target/release/phylode install
          phylode --version | tee "$RUNNER_TEMP/before"
          grep -qx "Phylode ${PREV#v}" "$RUNNER_TEMP/before" \
            || { echo "::error::expected Phylode ${PREV#v} after installing $PREV"; exit 1; }
          dig @127.0.0.1 apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
            || { echo "::error::$PREV does not answer"; exit 1; }

      # The steps are read from the README rather than copied here, so editing the README is
      # what this checks. What breaks if you change it: the "From source" subheading under
      # "Update Phylode" and the first bash block under it are how the steps are found.
      - name: Update with the README's steps, exactly as written
        working-directory: ${{ runner.temp }}/user
        run: |
          awk '/^## Update Phylode/{u=1} u && /^### From source/{s=1} s && /^```bash/{b=1; next} b && /^```/{exit} b' \
            "$GITHUB_WORKSPACE/README.md" > "$RUNNER_TEMP/steps.sh"
          echo "--- the README's update steps:"; cat "$RUNNER_TEMP/steps.sh"
          [ -s "$RUNNER_TEMP/steps.sh" ] || { echo "::error::no update steps found in the README"; exit 1; }
          bash -euxo pipefail "$RUNNER_TEMP/steps.sh"

      - name: The new version is installed and answering
        run: |
          phylode --version | tee "$RUNNER_TEMP/after"
          grep -qx "Phylode $NEXT" "$RUNNER_TEMP/after" \
            || { echo "::error::expected Phylode $NEXT after the update"; exit 1; }
          dig @127.0.0.1 apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
            || { echo "::error::no answer after the update"; exit 1; }
          dig @127.0.0.1 iadsdk.apple.com +short +time=3 +tries=2 | grep -qx '0.0.0.0' \
            || { echo "::error::not blocking after the update"; exit 1; }

      - name: Uninstall
        if: always()
        run: sudo /usr/local/bin/phylode uninstall || true

  # brew upgrade from the version before to this one, with the firewall on, counting lookups
  # that fail while the service swaps. Both ends are test builds of this commit: a release
  # from before Homebrew support has no upgrade helper, and a published release fetches its
  # checksums from GitHub, which has none for a version not yet released
  # (.github/scripts/homebrew-test.sh).
  homebrew:
    name: upgrade with brew upgrade
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      PHYLODE_TEST_WORK: /private/tmp/phylode-homebrew
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Build this commit as the version before and as the next
        run: |
          v=$(sed -nE 's/^version = "(.+)"$/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor patch <<< "$v"
          next="$major.$minor.$((patch + 1))"
          echo "PREV=$v" >> "$GITHUB_ENV"
          echo "NEXT=$next" >> "$GITHUB_ENV"
          bash .github/scripts/homebrew-test.sh build "$v"
          bash .github/scripts/homebrew-test.sh build "$next"

      - name: Turn the macOS firewall on, as many Macs have it
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on

      - name: Install the version before from the tap
        run: |
          t=.github/scripts/homebrew-test.sh
          bash $t tap
          bash $t offer "$PREV"
          brew install jonathansdev/tap/phylode
          sudo /opt/homebrew/opt/phylode/bin/phylode install
          [ "$(phylode --version)" = "Phylode $PREV (test build)" ] || { echo "::error::$(phylode --version)"; exit 1; }

      - name: brew upgrade swaps in the new version, and lookups keep being answered
        run: |
          t=.github/scripts/homebrew-test.sh
          work="$PHYLODE_TEST_WORK"
          ( total=0; failed=0
            while [ ! -e "$work/stop" ]; do
              total=$((total + 1))
              dig @127.0.0.1 apple.com +short +time=1 +tries=1 | grep -qE '^[0-9.]+$' || failed=$((failed + 1))
              echo "$total $failed" > "$work/lookups"
              sleep 0.2
            done ) &
          loop=$!
          n=$(bash $t lines)
          bash $t offer "$NEXT"
          start=$(date +%s)
          brew upgrade jonathansdev/tap/phylode
          for _ in $(seq 1 240); do
            [ "$(phylode --version)" = "Phylode $NEXT (test build)" ] && break
            sleep 1
          done
          echo "the new version was in place $(( $(date +%s) - start ))s after brew upgrade began"
          bash $t wait "$n"
          echo "recorded $(( $(date +%s) - start ))s after brew upgrade began, after watching it for 60s"
          touch "$work/stop"; wait "$loop"
          read -r total failed < "$work/lookups"
          echo "lookups during the upgrade: $total, failed: $failed"
          tail -1 /usr/local/libexec/phylode/history.tsv \
            | awk -F'\t' -v v="$NEXT" -v p="$PREV" '$2 == "upgraded" && $3 == v && $4 == p { ok = 1 } END { exit !ok }' \
            || { echo "::error::the helper did not record the upgrade from $PREV to $NEXT"; exit 1; }
          [ "$(phylode --version)" = "Phylode $NEXT (test build)" ] || { echo "::error::$(phylode --version)"; exit 1; }

      - name: After the upgrade, other devices reach it and status and the summary say so
        run: |
          lan=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          dig @"$lan" apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
            || { echo "::error::no answer on $lan after the upgrade"; exit 1; }
          dig @127.0.0.1 iadsdk.apple.com +short +time=3 +tries=2 | grep -qx '0.0.0.0' \
            || { echo "::error::not blocking after the upgrade"; exit 1; }
          /usr/libexec/ApplicationFirewall/socketfilterfw --listapps | grep -A1 /usr/local/bin/phylode
          phylode status | head -3
          phylode status | grep -q "^Last upgrade: .* Upgraded from $PREV to $NEXT$" \
            || { echo "::error::status does not show the upgrade"; exit 1; }
          phylode report | sed -n '/^3\./,/^4\./p' | tee /dev/stderr | grep -q "Upgraded from $PREV to $NEXT" \
            || { echo "::error::the weekly summary does not show the upgrade"; exit 1; }

      - name: Logs
        if: always()
        run: |
          sudo tail -40 /var/log/phylode/stderr.log || true
          sudo cat /var/log/phylode/upgrade.log || true
          cat /usr/local/libexec/phylode/history.tsv || true

      - name: Uninstall
        if: always()
        run: sudo /usr/local/bin/phylode uninstall || true
