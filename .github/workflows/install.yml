name: Install test

# Runs `phylode install`, `on`, `off` and `uninstall` for real on a throwaway macOS runner and
# exercises the installed service end to end. This is the path the README gives to new users,
# so it must work on a clean machine.

on:
  push:
    branches: [main]
    paths: ["src/**", "deploy/**", "Cargo.toml", "Cargo.lock", ".github/homebrew/**", ".github/scripts/**", ".github/workflows/install.yml"]
  # Every pull request: main requires this check, and one skipped by a path filter never reports.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: macos-latest
    # Each install over a running service watches it for 60 seconds before it is done.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release
      # Kept so a runtime check (`.claude/skills/verify`) can run this exact binary instead of
      # compiling it again on a laptop.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phylode-release
          path: target/release/phylode
          retention-days: 3

      # With the firewall on, install must still succeed and register the binary on the firewall's
      # allowed list. Whether that entry is what lets other devices through cannot be shown here:
      # on this runner, queries on the network address are answered even with the entry blocked.
      - name: Install refuses a folder an access control entry opens to standard accounts
        run: |
          entry="group:staff allow add_file,delete_child"
          sudo chmod +a "$entry" /usr/local/bin
          if out=$(sudo ./target/release/phylode install 2>&1); then
            echo "$out"; echo "::error::install accepted /usr/local/bin with \"$entry\""; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "can be changed by an account that is not an administrator" \
            || { echo "::error::install failed, but not because of the folder"; exit 1; }
          if test -e /usr/local/bin/phylode; then echo "::error::install wrote before refusing"; exit 1; fi
          sudo chmod -a "$entry" /usr/local/bin

      - name: Turn the macOS firewall on, as many Macs have it
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on

      - name: Install
        run: |
          start=$(date +%s)
          sudo ./target/release/phylode install
          echo "install took $(( $(date +%s) - start ))s, including the list download and the first answer"
          /usr/libexec/ApplicationFirewall/socketfilterfw --listapps | grep -q /usr/local/bin/phylode \
            || { echo "::error::install did not register with the firewall"; exit 1; }
          # newsyslog reads the rotation file and would rotate each service log.
          rotation=$(sudo newsyslog -nv -f /etc/newsyslog.d/phylode.conf 2>&1) \
            || { echo "$rotation"; echo "::error::newsyslog cannot read the rotation file"; exit 1; }
          echo "$rotation"
          echo "$rotation" | grep -q "/var/log/phylode/stderr.log" \
            || { echo "::error::newsyslog does not look at the service log"; exit 1; }
          id=$(dscl . -read /Users/_phylode UniqueID | awk '{print $2}')
          echo "service account ID: $id"
          [ "$id" -ge 400 ] && [ "$id" -le 499 ] \
            || { echo "::error::the service account took ID $id, outside 400-499"; exit 1; }

      - name: Built from source, it registers no upgrade helper and records where it came from
        run: |
          ls /Library/LaunchDaemons | grep -i phylode
          if test -e /Library/LaunchDaemons/com.Phylode.upgrade.plist \
             || sudo launchctl print system/com.Phylode.upgrade >/dev/null 2>&1; then
            echo "::error::a build from source registered the upgrade helper"; exit 1
          fi
          [ "$(ls /Library/LaunchDaemons | grep -c '^com\.Phylode\.')" -eq 2 ] \
            || { echo "::error::expected two launchd jobs"; exit 1; }
          if test -e /usr/local/libexec/phylode-update-lists; then
            echo "::error::the old list update script is still installed"; exit 1
          fi
          status=$(phylode status)
          echo "$status" | head -3
          echo "$status" | grep -qx "Version: $(sed -nE 's/^version = "(.+)"$/\1/p' Cargo.toml | head -1), built from source" \
            || { echo "::error::status does not say the version and that it was built from source"; exit 1; }
          # The two jobs run as the service account, and run the installed program only.
          for job in gatekeeper blocklist-update; do
            printed=$(sudo launchctl print "system/com.Phylode.$job")
            echo "$printed" | grep -E '^\s*(program|username) = ' || true
            echo "$printed" | grep -qE '^\s*program = /usr/local/bin/phylode$' \
              || { echo "::error::com.Phylode.$job does not run /usr/local/bin/phylode"; exit 1; }
          done
          ps -o user=,command= -p "$(sh .github/scripts/service-pid.sh)" | tee /dev/stderr \
            | grep -q '^_phylode ' || { echo "::error::the service does not run as _phylode"; exit 1; }

      - name: Other devices can use it through this Mac's network address
        run: |
          lan=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          echo "network address: $lan"
          dig @"$lan" apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
            || { echo "::error::no answer on $lan"; exit 1; }
          dig @"$lan" iadsdk.apple.com +short +time=3 +tries=2 | grep -qx '0.0.0.0' \
            || { echo "::error::not blocking on $lan"; exit 1; }

      - name: Root owns the log folder, and the service account only its logs and journal
        run: |
          ls -la /var/log/phylode
          [ "$(stat -f '%Su' /var/log/phylode)" = root ] \
            || { echo "::error::the service account can change the folder newsyslog rotates in"; exit 1; }
          for log in stderr stdout update; do
            [ "$(stat -f '%Su:%Sg %Lp' /var/log/phylode/$log.log)" = "_phylode:admin 640" ] \
              || { echo "::error::$log.log is not the service's"; exit 1; }
          done
          [ "$(stat -f '%Su:%Sg %Lp' /var/log/phylode/queries)" = "_phylode:admin 750" ] \
            || { echo "::error::the journal folder is not the service's"; exit 1; }
          dig @127.0.0.1 journal-check.example.com +short > /dev/null || true
          for _ in $(seq 1 15); do
            sudo grep -rqs journal-check.example.com /var/log/phylode/queries && break
            sleep 1
          done
          sudo grep -rqs journal-check.example.com /var/log/phylode/queries \
            || { echo "::error::the service could not write its journal"; exit 1; }

      - name: The service refuses to run as root
        run: |
          if out=$(sudo /usr/local/bin/phylode run service --config /usr/local/etc/phylode.conf 2>&1); then
            echo "$out"; echo "::error::the service ran as root"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "does not run as root" \
            || { echo "::error::it stopped, but not because it was root"; exit 1; }

      - name: Updating over an older install removes a link planted among the logs
        run: |
          # The layout before this fix: the service account owned the folder and could put a
          # link to a system file where newsyslog and install expect a log.
          sudo chown _phylode /var/log/phylode
          sudo -u _phylode ln -sf /etc/hosts /var/log/phylode/stdout.log.planted
          sudo -u _phylode mv -f /var/log/phylode/stdout.log.planted /var/log/phylode/stdout.log
          sudo ./target/release/phylode install
          [ "$(stat -f '%Su' /etc/hosts)" = root ] \
            || { echo "::error::install changed the owner of the file a link pointed at"; exit 1; }
          [ -f /var/log/phylode/stdout.log ] && [ ! -L /var/log/phylode/stdout.log ] \
            || { echo "::error::the planted link is still there"; exit 1; }
          [ "$(stat -f '%Su' /var/log/phylode)" = root ] \
            || { echo "::error::install left the folder with the service account"; exit 1; }

      - name: Reinstalling over a running service (an update) keeps it answering
        run: |
          # With a list download in progress, launchd is still tearing the job down when install
          # unloads it; loading it again too early fails with "Bootstrap failed: 5".
          sudo launchctl kickstart system/com.Phylode.blocklist-update
          sudo ./target/release/phylode install
          lan=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          dig @"$lan" apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
            || { echo "::error::no answer on $lan after reinstalling"; exit 1; }

      # macOS lets any account bind a port below 1024 on every address while nothing holds it.
      # The impostor is Phylode itself run by this standard account, so it answers like the
      # real service would.
      - name: An update never leaves port 53 free for another account to take
        run: |
          cat > "$RUNNER_TEMP/impostor.conf" <<EOF
          listen = 0.0.0.0:53
          upstream = tls 1.1.1.1 cloudflare-dns.com
          journal_dir = $RUNNER_TEMP/impostor-journal
          EOF
          # set +e: each failed attempt to take the port must not end the loop.
          ( set +e
            while true; do
              echo "attempt" >> "$RUNNER_TEMP/impostor.log"
              ./target/release/phylode run service --config "$RUNNER_TEMP/impostor.conf" >> "$RUNNER_TEMP/impostor.log" 2>&1
              sleep 0.05
            done ) &
          loop=$!
          sudo ./target/release/phylode install
          kill "$loop" 2>/dev/null || true
          pkill -f impostor.conf || true
          attempts=$(grep -c '^attempt$' "$RUNNER_TEMP/impostor.log")
          echo "the impostor tried $attempts times"
          [ "$attempts" -ge 5 ] \
            || { cat "$RUNNER_TEMP/impostor.log"; echo "::error::the impostor stopped trying, so this proves nothing"; exit 1; }
          if grep -q "Phylode serving on" "$RUNNER_TEMP/impostor.log"; then
            echo "::error::another account took port 53 during the update"; exit 1
          fi

      - name: on refuses a port 53 another account's program holds
        run: |
          sudo launchctl bootout system/com.Phylode.gatekeeper
          while sudo launchctl print system/com.Phylode.gatekeeper >/dev/null 2>&1; do sleep 0.5; done
          ./target/release/phylode run service --config "$RUNNER_TEMP/impostor.conf" > "$RUNNER_TEMP/impostor-on.log" 2>&1 &
          impostor=$!
          for _ in $(seq 1 20); do
            dig @127.0.0.1 apple.com +short +time=1 +tries=1 | grep -q . && break
            sleep 0.5
          done
          # The control: without it, a refusal below could mean the impostor never got the port.
          grep -q "Phylode serving on" "$RUNNER_TEMP/impostor-on.log" \
            || { cat "$RUNNER_TEMP/impostor-on.log"; echo "::error::a standard account could not take port 53 here"; exit 1; }
          service=$(.github/scripts/primary-network-service.sh)
          before=$(networksetup -getdnsservers "$service")
          if out=$(sudo phylode on 2>&1); then
            echo "$out"; echo "::error::on pointed DNS at a port another program holds"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "is held by" \
            || { echo "::error::on failed without naming who holds the port"; exit 1; }
          [ "$(networksetup -getdnsservers "$service")" = "$before" ] \
            || { echo "::error::on changed DNS even though it refused"; exit 1; }
          kill "$impostor"
          sudo ./target/release/phylode install

      - name: Resolves through the service
        run: |
          dig @127.0.0.1 apple.com +short | grep -E '^[0-9.]+$'
          dig @127.0.0.1 apple.com AAAA +tcp +short

      - name: Blocks straight away, because install waited for the lists
        run: |
          answer=$(dig @127.0.0.1 iadsdk.apple.com +short +time=2 +tries=1 || true)
          if [ "$answer" != "0.0.0.0" ]; then
            echo "::error::iadsdk.apple.com was not blocked right after install (got '$answer')"
            phylode status || true
            exit 1
          fi
          echo "blocked: iadsdk.apple.com -> 0.0.0.0"

      - name: Apple hard rules always resolve
        run: |
          for host in captive.apple.com api.push.apple.com 1-courier.push.apple.com; do
            answer=$(dig @127.0.0.1 "$host" +short | tail -1)
            if [ -z "$answer" ] || [ "$answer" = "0.0.0.0" ]; then
              echo "::error::$host did not resolve (got '$answer')"; exit 1
            fi
            echo "$host -> $answer"
          done

      - name: allow and block work without sudo
        run: |
          phylode allow iadsdk.apple.com
          allowed=0
          for _ in $(seq 1 15); do
            answer=$(dig @127.0.0.1 iadsdk.apple.com +short | tail -1)
            if [ -n "$answer" ] && [ "$answer" != "0.0.0.0" ]; then echo "allowed: $answer"; allowed=1; break; fi
            sleep 1
          done
          if [ "$allowed" -ne 1 ]; then echo "::error::allow did not take effect"; exit 1; fi
          phylode block iadsdk.apple.com
          for _ in $(seq 1 15); do
            if [ "$(dig @127.0.0.1 iadsdk.apple.com +short)" = "0.0.0.0" ]; then echo "blocked again"; exit 0; fi
            sleep 1
          done
          echo "::error::block did not take effect"; exit 1

      - name: status and report work without sudo, and a fresh install reports no gap
        run: |
          phylode status
          report=$(phylode report)
          echo "$report"
          if echo "$report" | grep -q "blocklist failed to load"; then
            echo "::error::a fresh install already reports a window without protection"; exit 1
          fi
          phylode status | grep -q "journal = All" \
            || { echo "::error::status does not show the journal level"; exit 1; }

      - name: forget deletes the lookups, keeps the events, and the service keeps answering
        run: |
          lookups() { ls /var/log/phylode/queries | grep -cE '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.tsv$' || true; }
          dig @127.0.0.1 apple.com +short +time=3 +tries=2 | grep -q .
          sleep 3   # the journal is written in batches
          # The control: there must be something to delete, or an empty folder proves nothing.
          [ "$(lookups)" -ge 1 ] || { echo "::error::no lookup file before forget"; exit 1; }
          sudo phylode forget
          [ "$(lookups)" -eq 0 ] || { echo "::error::forget left lookup files"; exit 1; }
          ls /var/log/phylode/queries | grep -q '^events-' \
            || { echo "::error::forget deleted the service events"; exit 1; }
          dig @127.0.0.1 apple.com +short +time=3 +tries=2 | grep -q . \
            || { echo "::error::no answer after forget"; exit 1; }

      - name: feedback sees a healthy install and leaks no addresses or home folders
        run: |
          out=$(sudo phylode feedback)
          echo "$out"
          echo "$out" | grep -qx 'Service answering: yes' || { echo "::error::feedback did not see the service answering"; exit 1; }
          echo "$out" | grep -q 'domains loaded' || { echo "::error::feedback did not see the lists"; exit 1; }
          leaked=$(echo "$out" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | grep -vxE '127\.0\.0\.1|0\.0\.0\.0' || true)
          if [ -n "$leaked" ] || echo "$out" | grep -q '/Users/'; then
            echo "::error::feedback leaked: $leaked"; exit 1
          fi

      - name: launchd brings the service back after it dies
        run: |
          pid=$(sh .github/scripts/service-pid.sh)
          sudo kill -9 "$pid"
          for _ in $(seq 1 30); do
            new=$(sh .github/scripts/service-pid.sh)
            if [ -n "$new" ] && [ "$new" != "$pid" ] && dig @127.0.0.1 apple.com +short +time=1 +tries=1 | grep -q .; then
              echo "restarted: pid $pid -> $new"; exit 0
            fi
            sleep 1
          done
          echo "::error::the service did not come back"; exit 1

      # Stuck but still running is what launchd cannot see. Dropping UDP on the loopback interface
      # makes the self health check go unanswered while the process stays alive.
      - name: A service that stops answering restarts itself, and the summary says so
        run: |
          pid=$(sh .github/scripts/service-pid.sh)
          echo "block drop quick on lo0 proto udp from any to any port 53" | sudo pfctl -q -f -
          token=$(sudo pfctl -E 2>&1 | sed -n 's/.*Token : //p')
          start=$(date +%s)
          restarted=0
          for _ in $(seq 1 90); do
            new=$(sh .github/scripts/service-pid.sh)
            if [ -n "$new" ] && [ "$new" != "$pid" ]; then restarted=1; break; fi
            sleep 1
          done
          sudo pfctl -q -X "$token" || sudo pfctl -q -d || true
          sudo pfctl -q -f /etc/pf.conf
          if [ "$restarted" -ne 1 ]; then echo "::error::a service that stopped answering was not restarted"; exit 1; fi
          echo "restarted itself after $(( $(date +%s) - start ))s: pid $pid -> $new"
          answered=0
          for _ in $(seq 1 30); do
            if dig @127.0.0.1 apple.com +short +time=1 +tries=1 | grep -q .; then answered=1; break; fi
            sleep 1
          done
          if [ "$answered" -ne 1 ]; then echo "::error::no answers after the restart"; exit 1; fi
          report=$(phylode report)
          echo "$report" | sed -n '/own health/,$p'
          echo "$report" | grep -q "Phylode stopped answering and restarted itself" \
            || { echo "::error::the weekly summary does not mention the restart"; exit 1; }

      # The query for a made-up name must leave this Mac only inside TLS. Loopback is captured
      # too, as the control: the same grep has to find the name there in plaintext.
      - name: Queries leave the Mac encrypted, with no name in plaintext
        run: |
          iface=$(route -n get default | awk '/interface:/{print $2}')
          name="leak-check-$RANDOM$RANDOM"
          sudo tcpdump -i "$iface" -nn -U -w "$RUNNER_TEMP/out.pcap" 2>/dev/null &
          sudo tcpdump -i lo0 -nn -U -w "$RUNNER_TEMP/lo.pcap" 'udp port 53' 2>/dev/null &
          sleep 2
          # A fresh start, so the capture holds the TLS handshake as well as the query.
          sudo launchctl kickstart -k system/com.Phylode.gatekeeper
          for _ in $(seq 1 30); do
            if dig @127.0.0.1 captive.apple.com +short +time=1 +tries=1 | grep -q .; then break; fi
            sleep 1
          done
          dig @127.0.0.1 "$name.example.com" +time=3 +tries=1 || true
          sleep 2
          sudo pkill tcpdump || true
          sleep 1
          sudo chmod a+r "$RUNNER_TEMP/out.pcap" "$RUNNER_TEMP/lo.pcap"
          grep -aq "$name" "$RUNNER_TEMP/lo.pcap" \
            || { echo "::error::control failed: the name is not in the loopback capture either"; exit 1; }
          if grep -aq "$name" "$RUNNER_TEMP/out.pcap"; then
            echo "::error::$name left the Mac in plaintext"; exit 1
          fi
          plain=$(tcpdump -r "$RUNNER_TEMP/out.pcap" -nn 'port 53 and (host 1.1.1.1 or host 9.9.9.9)' 2>/dev/null | wc -l)
          if [ "$plain" -ne 0 ]; then echo "::error::$plain plaintext DNS packets to an upstream"; exit 1; fi
          encrypted=$(tcpdump -r "$RUNNER_TEMP/out.pcap" -nn \
            '(host 1.1.1.1 and tcp port 853) or (host 9.9.9.9 and tcp port 443)' 2>/dev/null | wc -l)
          if [ "$encrypted" -eq 0 ]; then echo "::error::no traffic to an encrypted upstream"; exit 1; fi
          # A TLS record starts with its type: 0x16 is a handshake. DoT sends no server name
          # (hickory turns SNI off), so the record type is what shows the session is TLS.
          tls='tcp[((tcp[12:1] & 0xf0) >> 2):1] = 0x16'
          handshakes=$(tcpdump -r "$RUNNER_TEMP/out.pcap" -nn \
            "((dst host 1.1.1.1 and tcp dst port 853) or (dst host 9.9.9.9 and tcp dst port 443)) and $tls" \
            2>/dev/null | wc -l)
          if [ "$handshakes" -eq 0 ]; then echo "::error::no TLS handshake with an upstream"; exit 1; fi
          echo "loopback: $name in plaintext (control); outside: $encrypted packets to an encrypted upstream,"
          echo "$handshakes of them TLS handshake records, no plaintext DNS to it, and $name nowhere in the capture"

      # A validating client checks the whole chain itself: signatures for a signed name, the
      # parent's signed proof that an unsigned name is unsigned, and the signed proof that a
      # name does not exist. delv (from BIND) is such a client, independent of Apple's, so it
      # proves Phylode passes all three on unchanged; each result must match 1.1.1.1's.
      - name: Signatures and proofs reach a validating client unchanged
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet bind
          delv="$(brew --prefix bind)/bin/delv"
          failed=0
          for query in "isc.org A" "github.com A" "phylode-no-such-name.isc.org A"; do
            # shellcheck disable=SC2086 # the name and the type are two arguments
            control=$("$delv" @1.1.1.1 $query 2>&1 | grep -m1 '^; ' || true)
            # shellcheck disable=SC2086
            through=$("$delv" @127.0.0.1 $query 2>&1 | grep -m1 '^; ' || true)
            echo "$query: 1.1.1.1 says '$control'; through Phylode '$through'"
            case "$control" in
              *"fully validated"* | *"unsigned answer"*) ;;
              *) echo "::warning::$query did not validate against 1.1.1.1 either, so it says nothing about Phylode"; continue ;;
            esac
            [ "$through" = "$control" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::a validating client could not check an answer through Phylode"
            exit 1
          fi

      # Apple's own validator, as an app that requires DNSSEC validation uses it. Its
      # mDNSResponder builds of 2026-10-12, on both the macOS 15 and macOS 26 images, never
      # finish proving a name unsigned, whatever the resolver, so the control fails there and
      # the step above is what proves the passthrough. This one warns until Apple fixes it.
      - name: Apps that require DNSSEC validation connect through Phylode
        run: |
          cat > "$RUNNER_TEMP/validating.swift" <<'EOF'
          import Foundation
          var failed = 0
          for target in CommandLine.arguments.dropFirst() {
              let configuration = URLSessionConfiguration.ephemeral
              configuration.requiresDNSSECValidation = true
              var request = URLRequest(url: URL(string: target)!)
              request.requiresDNSSECValidation = true
              request.timeoutInterval = 30
              do {
                  _ = try await URLSession(configuration: configuration).data(for: request)
                  print("\(target): connected")
              } catch {
                  print("\(target): failed \((error as NSError).code)")
                  failed += 1
              }
          }
          exit(failed == 0 ? 0 : 1)
          EOF
          # Two signed domains and two unsigned ones.
          sites="https://www.isc.org https://www.cloudflare.com https://github.com https://www.apple.com"
          service=$(.github/scripts/primary-network-service.sh)
          sudo networksetup -setdnsservers "$service" 1.1.1.1
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder
          if ! swift "$RUNNER_TEMP/validating.swift" $sites; then
            # Shows whether 1.1.1.1 was in use and reachable, so the next run can tell why.
            echo "service: $service"; networksetup -getdnsservers "$service"
            networksetup -listnetworkserviceorder
            scutil --dns | sed -n 1,20p
            dig @1.1.1.1 www.isc.org +dnssec +time=3 +tries=1 | sed -n 1,20p || true
            # Validation fetches the root keys, which can outgrow UDP and move to TCP; a request
            # without validation tells a validation failure from no connection at all.
            for transport in +notcp +tcp; do
              echo "root DNSKEY over $transport:"
              dig @1.1.1.1 . DNSKEY +dnssec "$transport" +time=3 +tries=1 \
                | grep -E 'status:|flags:|MSG SIZE|timed out|truncated' || true
            done
            curl -sS -o /dev/null --max-time 10 \
              -w 'https://www.isc.org without validation: %{http_code}\n' https://www.isc.org || true
            sudo log show --last 3m --style compact --predicate 'process == "mDNSResponder"' \
              | grep -iE 'dnssec|validat|insecure|bogus' | tail -20 || true
            # A runner that breaks validation even with 1.1.1.1 says nothing about Phylode, so the
            # run warns and skips the Phylode half instead of failing every pull request.
            sudo networksetup -setdnsservers "$service" empty
            echo "::warning::the probe failed with 1.1.1.1 too, so this run cannot tell"; exit 0
          fi
          sudo networksetup -setdnsservers "$service" empty
          sudo phylode on
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder
          swift "$RUNNER_TEMP/validating.swift" $sites \
            || { echo "::error::an app requiring DNSSEC validation could not connect through Phylode"; sudo phylode off; exit 1; }
          sudo phylode off
          sudo networksetup -setdnsservers "$service" empty

      - name: on and off switch this Mac's DNS
        # A negated command (! cmd) never fails a step under set -e, so each check is explicit.
        run: |
          service=$(.github/scripts/primary-network-service.sh)
          # DNS set by hand before `on` must be what `off` puts back.
          sudo networksetup -setdnsservers "$service" 1.1.1.1 9.9.9.9
          out=$(sudo phylode on)
          echo "$out"
          echo "$out" | grep -q "Other devices on this network can use it too: set [0-9]" \
            || { echo "::error::on did not tell the user which address other devices use"; exit 1; }
          if ! networksetup -getdnsservers "$service" | grep -q '^127\.0\.0\.1$'; then
            echo "::error::on did not point \"$service\" at the service"; exit 1
          fi
          dig apple.com +short +time=2 | grep -q .
          sudo phylode off
          after=$(networksetup -getdnsservers "$service" | tr '\n' ' ')
          if [ "$after" != "1.1.1.1 9.9.9.9 " ]; then
            echo "::error::off did not put back the DNS set by hand (got '$after')"; exit 1
          fi
          if test -e /usr/local/etc/phylode/dns-before-on.tsv; then
            echo "::error::off left its saved DNS file behind"; exit 1
          fi
          sudo networksetup -setdnsservers "$service" empty

      - name: Uninstall restores DNS and leaves nothing running
        run: |
          service=$(.github/scripts/primary-network-service.sh)
          sudo phylode on
          sudo phylode uninstall
          if pgrep -x phylode; then echo "::error::the service is still running"; exit 1; fi
          for f in /usr/local/bin/phylode /Library/LaunchDaemons/com.Phylode.gatekeeper.plist \
                   /Library/LaunchDaemons/com.Phylode.blocklist-update.plist \
                   /Library/LaunchDaemons/com.Phylode.upgrade.plist /usr/local/libexec/phylode \
                   /usr/local/libexec/phylode-update-lists /etc/newsyslog.d/phylode.conf; do
            if test -e "$f"; then echo "::error::left behind: $f"; exit 1; fi
          done
          if networksetup -getdnsservers "$service" | grep -q '^127\.0\.0\.1$'; then
            echo "::error::uninstall left \"$service\" pointing at the removed service"; exit 1
          fi
          if /usr/libexec/ApplicationFirewall/socketfilterfw --listapps | grep -q /usr/local/bin/phylode; then
            echo "::error::uninstall left the firewall entry behind"; exit 1
          fi
          dig apple.com +short +time=2 | grep -q .

      - name: Service logs
        if: always()
        run: sudo tail -60 /var/log/phylode/stderr.log || true

  # The path a stranger takes: brew install, then the one line Homebrew prints. Then what the
  # upgrade helper does with a download that was changed, and how a version that does not keep
  # answering is put back, through install and through an upgrade. A fresh runner, so Homebrew
  # starts clean. Test builds stand in for releases: they fetch checksums from a folder here
  # instead of GitHub (.github/scripts/homebrew-test.sh).
  homebrew:
    name: install from Homebrew
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      PHYLODE_TEST_WORK: /private/tmp/phylode-homebrew
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # V0 is this commit's version; the others count up from it, because the helper only
      # ever moves to a newer version.
      - name: Build this commit as four versions
        run: |
          v=$(sed -nE 's/^version = "(.+)"$/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor patch <<< "$v"
          for n in 0 1 2 3; do echo "V$n=$major.$minor.$((patch + n))" >> "$GITHUB_ENV"; done
          t=.github/scripts/homebrew-test.sh
          bash $t build "$v"
          bash $t build "$major.$minor.$((patch + 1))"
          # Never answers.
          bash $t build "$major.$minor.$((patch + 2))" 0
          # Answers, then stops after 30 seconds.
          bash $t build "$major.$minor.$((patch + 3))" 30

      - name: Turn the macOS firewall on, as many Macs have it
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on

      - name: brew install by its full name, then the line Homebrew prints
        run: |
          t=.github/scripts/homebrew-test.sh
          bash $t tap
          bash $t offer "$V0"
          brew install jonathansdev/tap/phylode
          brew info jonathansdev/tap/phylode | tee "$PHYLODE_TEST_WORK/caveats.txt"
          grep -qx '  sudo /opt/homebrew/opt/phylode/bin/phylode install' "$PHYLODE_TEST_WORK/caveats.txt" \
            || { echo "::error::Homebrew does not print the first install command"; exit 1; }
          grep -qx '  sudo phylode uninstall' "$PHYLODE_TEST_WORK/caveats.txt" \
            || { echo "::error::Homebrew does not print the reminder before brew uninstall"; exit 1; }
          if test -e /opt/homebrew/bin/phylode; then echo "::error::Homebrew linked phylode onto PATH"; exit 1; fi
          cmp /opt/homebrew/opt/phylode/bin/phylode "$PHYLODE_TEST_WORK/bin/$V0" \
            || { echo "::error::Homebrew changed the program it installed, so no checksum would match"; exit 1; }
          start=$(date +%s)
          sudo /opt/homebrew/opt/phylode/bin/phylode install
          echo "first install took $(( $(date +%s) - start ))s"

      - name: phylode, with or without sudo, is the installed copy, and it answers
        run: |
          [ "$(which phylode)" = /usr/local/bin/phylode ] || { echo "::error::phylode is $(which phylode)"; exit 1; }
          [ "$(sudo -s which phylode)" = /usr/local/bin/phylode ] \
            || { echo "::error::sudo phylode is $(sudo -s which phylode)"; exit 1; }
          [ "$(phylode --version)" = "Phylode $V0 (test build)" ] || { echo "::error::$(phylode --version)"; exit 1; }
          phylode status | head -2
          phylode status | grep -qx "Version: $V0, installed from Homebrew" \
            || { echo "::error::status does not say it was installed from Homebrew"; exit 1; }
          lan=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          dig @127.0.0.1 apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
            || { echo "::error::no answer on loopback"; exit 1; }
          dig @"$lan" apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
            || { echo "::error::no answer on $lan with the firewall on"; exit 1; }
          /usr/libexec/ApplicationFirewall/socketfilterfw --listapps | grep -q /usr/local/bin/phylode \
            || { echo "::error::install did not register with the firewall"; exit 1; }
          ls /Library/LaunchDaemons | grep '^com\.Phylode\.'
          [ "$(ls /Library/LaunchDaemons | grep -c '^com\.Phylode\.')" -eq 3 ] \
            || { echo "::error::expected three launchd jobs"; exit 1; }
          for job in gatekeeper blocklist-update upgrade; do
            sudo launchctl print "system/com.Phylode.$job" | grep -qE '^\s*program = /usr/local/bin/phylode$' \
              || { echo "::error::com.Phylode.$job does not run /usr/local/bin/phylode"; exit 1; }
          done

      # What System Settings > General > Login Items & Extensions lists, from the database it
      # reads: three items, each running the installed copy. macOS names a launchd job by its
      # program's file name, so each shows as "phylode", whatever name the program embeds.
      - name: macOS lists three background items, all the installed program
        run: |
          sudo sfltool dumpbtm > "$PHYLODE_TEST_WORK/btm.txt" 2>&1 || true
          awk 'BEGIN{RS=""} tolower($0) ~ /phylode/' "$PHYLODE_TEST_WORK/btm.txt" | tee "$PHYLODE_TEST_WORK/btm-phylode.txt"
          items=$(grep -cE '^\s*Identifier: [0-9]+\.com\.Phylode\.' "$PHYLODE_TEST_WORK/btm-phylode.txt" || true)
          paths=$(grep -E '^\s*Executable Path:' "$PHYLODE_TEST_WORK/btm-phylode.txt" | sort -u)
          echo "items: $items; programs: $paths"
          [ "$items" -eq 3 ] || { echo "::error::macOS lists $items Phylode background items, not 3"; exit 1; }
          [ "$paths" = "      Executable Path: /usr/local/bin/phylode" ] \
            || { echo "::error::a background item runs something other than /usr/local/bin/phylode"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: background-items
          path: /private/tmp/phylode-homebrew/btm*.txt
          retention-days: 14

      - name: install puts the version before back, for one that never answers and one that stops
        run: |
          before=$(shasum -a 256 /usr/local/bin/phylode)
          for v in "$V2" "$V3"; do
            start=$(date +%s)
            if out=$(sudo "$PHYLODE_TEST_WORK/bin/$v" install 2>&1); then
              echo "$out"; echo "::error::installing $v succeeded"; exit 1
            fi
            echo "$out" | tail -4
            echo "$v was put back after $(( $(date +%s) - start ))s"
            echo "$out" | grep -q "so the version installed before it was put back and is answering" \
              || { echo "::error::install did not put back the version before $v"; exit 1; }
            [ "$(shasum -a 256 /usr/local/bin/phylode)" = "$before" ] \
              || { echo "::error::the installed program is not the one from before"; exit 1; }
            dig @127.0.0.1 apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
              || { echo "::error::no answer after putting back"; exit 1; }
            grep -qx "$v" /usr/local/libexec/phylode/rejected \
              || { echo "::error::$v was put back but is not remembered"; exit 1; }
          done
          # The upgrade steps below offer these two versions through Homebrew, so the helper
          # must not know them yet.
          sudo rm /usr/local/libexec/phylode/rejected
          echo "$out" | grep -q "stopped within 60 seconds" \
            || { echo "::error::the version that stopped was not reported as stopping"; exit 1; }
          phylode status | grep -qx "Version: $V0, installed from Homebrew" \
            || { echo "::error::putting back changed where it was installed from"; exit 1; }
          sudo launchctl print system/com.Phylode.upgrade > /dev/null \
            || { echo "::error::putting back unregistered the upgrade helper"; exit 1; }

      - name: A download that does not match its checksum is refused, recorded, and not tried again
        run: |
          t=.github/scripts/homebrew-test.sh
          n=$(bash $t lines)
          bash $t offer "$V1" tamper
          brew upgrade jonathansdev/tap/phylode
          bash $t wait "$n"
          tail -1 /usr/local/libexec/phylode/history.tsv \
            | awk -F'\t' -v v="$V1" '$2 == "refused" && $3 == v && $4 == "checksum" { ok = 1 } END { exit !ok }' \
            || { echo "::error::the helper did not record refusing $V1"; exit 1; }
          [ "$(phylode --version)" = "Phylode $V0 (test build)" ] || { echo "::error::$V1 was installed"; exit 1; }
          grep -qx "$V1" /usr/local/libexec/phylode/rejected || { echo "::error::$V1 is not remembered"; exit 1; }
          phylode report | grep -q "Did not install $V1: Homebrew's copy does not match the checksum" \
            || { echo "::error::the weekly summary does not say why"; exit 1; }
          n=$(bash $t lines)
          sudo launchctl kickstart -k system/com.Phylode.upgrade
          sleep 10
          sudo tail -3 /var/log/phylode/upgrade.log
          sudo tail -1 /var/log/phylode/upgrade.log | grep -q "$V1 was put back or refused before" \
            || { echo "::error::the helper did not skip $V1"; exit 1; }
          [ "$(bash $t lines)" -eq "$n" ] || { echo "::error::the helper tried $V1 again"; exit 1; }

      - name: An upgrade puts the version before back, for one that never answers and one that stops
        run: |
          t=.github/scripts/homebrew-test.sh
          for v in "$V2" "$V3"; do
            n=$(bash $t lines)
            bash $t offer "$v"
            brew upgrade jonathansdev/tap/phylode
            bash $t wait "$n"
            tail -1 /usr/local/libexec/phylode/history.tsv \
              | awk -F'\t' -v v="$v" '$2 == "put-back" && $3 == v { ok = 1 } END { exit !ok }' \
              || { echo "::error::the helper did not put back the version before $v"; exit 1; }
            [ "$(phylode --version)" = "Phylode $V0 (test build)" ] || { echo "::error::$v stayed installed"; exit 1; }
            grep -qx "$v" /usr/local/libexec/phylode/rejected || { echo "::error::$v is not remembered"; exit 1; }
            lan=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
            dig @"$lan" apple.com +short +time=3 +tries=2 | grep -E '^[0-9.]+$' \
              || { echo "::error::no answer on $lan after putting back $v"; exit 1; }
          done

      - name: status and the weekly summary show the version, where it came from and the last upgrade
        run: |
          phylode status | head -3 | tee "$PHYLODE_TEST_WORK/status.txt"
          grep -q "^Last upgrade: .* Phylode $V3 stopped within 60 seconds of starting" "$PHYLODE_TEST_WORK/status.txt" \
            || { echo "::error::status does not show the last upgrade"; exit 1; }
          phylode report | sed -n '/^3\./,/^4\./p' | tee "$PHYLODE_TEST_WORK/report.txt"
          for line in "Did not install $V1" "Phylode $V2 did not answer within 15 seconds" \
                      "Phylode $V3 stopped within 60 seconds"; do
            grep -q "$line" "$PHYLODE_TEST_WORK/report.txt" || { echo "::error::section 3 lacks: $line"; exit 1; }
          done

      # V4 is V0's program under a newer number; it never runs, because without a checksum the
      # helper runs nothing.
      - name: Without its checksum from GitHub, a new version waits, is reported once, and is tried again
        run: |
          t=.github/scripts/homebrew-test.sh
          IFS=. read -r major minor patch <<< "$V0"
          v4="$major.$minor.$((patch + 4))"
          cp "$PHYLODE_TEST_WORK/bin/$V0" "$PHYLODE_TEST_WORK/bin/$v4"
          n=$(bash $t lines)
          bash $t offer "$v4"
          rm "$PHYLODE_TEST_WORK/checksums/$v4/phylode-$v4-arm64.bin.sha256"
          brew upgrade jonathansdev/tap/phylode
          bash $t wait "$n"
          tail -1 /usr/local/libexec/phylode/history.tsv \
            | awk -F'\t' -v v="$v4" '$2 == "waiting" && $3 == v { ok = 1 } END { exit !ok }' \
            || { echo "::error::the helper did not record waiting for $v4"; exit 1; }
          [ "$(phylode --version)" = "Phylode $V0 (test build)" ] || { echo "::error::$v4 was installed"; exit 1; }
          if grep -qx "$v4" /usr/local/libexec/phylode/rejected; then
            echo "::error::$v4 is remembered as refused, so it would never be tried again"; exit 1
          fi
          phylode report | grep -q "Phylode $v4 is waiting: GitHub could not be reached" \
            || { echo "::error::the weekly summary does not say $v4 is waiting"; exit 1; }
          n=$(bash $t lines)
          sudo launchctl kickstart -k system/com.Phylode.upgrade
          sleep 10
          sudo tail -1 /var/log/phylode/upgrade.log
          sudo tail -1 /var/log/phylode/upgrade.log | grep -q "could not fetch the checksum for $v4" \
            || { echo "::error::the helper did not try $v4 again"; exit 1; }
          [ "$(bash $t lines)" -eq "$n" ] || { echo "::error::the same wait was recorded twice"; exit 1; }

      - name: A Homebrew copy no newer than the installed one is left alone
        run: |
          t=.github/scripts/homebrew-test.sh
          # Every version, so the install below puts V0 in place rather than finding it kept.
          brew uninstall --force jonathansdev/tap/phylode
          bash $t offer "$V0"
          brew install jonathansdev/tap/phylode
          [ "$(basename "$(readlink /opt/homebrew/opt/phylode)")" = "$V0" ] \
            || { echo "::error::Homebrew does not offer $V0"; exit 1; }
          # Let the wakes from brew uninstall and brew install finish first.
          sleep 15
          n=$(bash $t lines)
          logs=$(sudo wc -l < /var/log/phylode/upgrade.log)
          sudo launchctl kickstart -k system/com.Phylode.upgrade
          for _ in $(seq 1 60); do
            [ "$(sudo wc -l < /var/log/phylode/upgrade.log)" -gt "$logs" ] && break
            sleep 1
          done
          sudo tail -1 /var/log/phylode/upgrade.log
          sudo tail -1 /var/log/phylode/upgrade.log | grep -q "Homebrew has no newer version" \
            || { echo "::error::the helper acted on the version already installed"; exit 1; }
          [ "$(bash $t lines)" -eq "$n" ] || { echo "::error::the helper recorded a change"; exit 1; }
          [ "$(phylode --version)" = "Phylode $V0 (test build)" ] || { echo "::error::$(phylode --version)"; exit 1; }

      - name: The service and the daily list update run as the service account
        run: |
          ps -o user=,command= -p "$(sh .github/scripts/service-pid.sh)" | tee /dev/stderr \
            | grep -q '^_phylode ' || { echo "::error::the service does not run as _phylode"; exit 1; }
          sudo launchctl kickstart -k system/com.Phylode.blocklist-update
          # The account is read again a moment after the process is first seen: one caught the
          # instant launchd started it has shown as root, though the job sets UserName.
          user=""
          for _ in $(seq 1 50); do
            pid=$(pgrep -f '^/usr/local/bin/phylode run lists' | head -1 || true)
            if [ -n "$pid" ]; then
              echo "first seen: $(ps -o user=,command= -p "$pid" || true)"
              sleep 0.2
              user=$(ps -o user= -p "$pid" | tr -d ' ' || true)
              [ -n "$user" ] && break
            fi
            sleep 0.1
          done
          echo "the list update, process $pid, runs as: ${user:-(not seen running)}"
          [ "$user" = _phylode ] || { echo "::error::the list update does not run as _phylode"; exit 1; }

      - name: uninstall says how to remove Homebrew's copy, then brew uninstall removes it
        run: |
          out=$(sudo phylode uninstall)
          echo "$out"
          echo "$out" | grep -q 'brew uninstall phylode' || { echo "::error::uninstall did not mention brew"; exit 1; }
          brew uninstall phylode
          for f in /usr/local/bin/phylode /usr/local/libexec/phylode /opt/homebrew/opt/phylode \
                   /Library/LaunchDaemons/com.Phylode.upgrade.plist; do
            if test -e "$f"; then echo "::error::left behind: $f"; exit 1; fi
          done

      - name: Logs
        if: always()
        run: |
          sudo tail -40 /var/log/phylode/stderr.log || true
          sudo cat /var/log/phylode/upgrade.log || true
          cat /usr/local/libexec/phylode/history.tsv || true
